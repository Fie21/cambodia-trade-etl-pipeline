x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: docker/airflow/Dockerfile
  user: "${AIRFLOW_UID:-50000}:0"
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DEFAULT_TIMEZONE: utc
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
    AIRFLOW__SCHEDULER__CATCHUP_BY_DEFAULT: "true"
    DATA_DIR: /opt/airflow/data
    DW_CONN_STR: postgresql+psycopg2://airflow:airflow@postgres:5432/transport_dw
    GDCE_API_TOKEN: "${GDCE_API_TOKEN:-fHs4RbfpSE57qfYM}"
    PYTHONPATH: /opt/airflow/src
  volumes:
    - ./dags:/opt/airflow/dags
    - ./src:/opt/airflow/src
    - ./data:/opt/airflow/data
    - airflow_logs:/opt/airflow/logs
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init-multiple-dbs.sh:/docker-entrypoint-initdb.d/01-init-multiple-dbs.sh
      - ./sql/init_warehouse.sql:/sql/init_warehouse.sql
    ports:
      - "5432:5432"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username admin --password admin \
          --firstname Admin --lastname User \
          --role Admin --email admin@example.com
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    command: ["app_business.py", "--server.port=8501", "--server.address=0.0.0.0"]
    environment:
      DW_CONN_STR: postgresql+psycopg2://airflow:airflow@postgres:5432/transport_dw
      PYTHONPATH: /app:/app/src
    volumes:
      - ./dashboard:/app
      - ./src:/app/src
    ports:
      - "8501:8501"
    depends_on:
      postgres:
        condition: service_healthy

  dashboard-de:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    command: ["app_data_engineering.py", "--server.port=8502", "--server.address=0.0.0.0"]
    environment:
      DW_CONN_STR: postgresql+psycopg2://airflow:airflow@postgres:5432/transport_dw
      PYTHONPATH: /app:/app/src
    volumes:
      - ./dashboard:/app
      - ./src:/app/src
    ports:
      - "8502:8502"
    depends_on:
      postgres:
        condition: service_healthy

  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    volumes:
      - ./docker/pgadmin/servers.json:/pgadmin4/servers.json:ro
      - pgadmin_data:/var/lib/pgadmin
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  airflow_logs:
  pgadmin_data:
